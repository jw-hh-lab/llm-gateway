# Redis: 응답 캐시와 사용량 제한 카운터. 지금은 캐시 용도라 디스크에 저장하지 않음(재시작하면 비워짐)
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: tollgate
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tollgate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          # 최대 256MB, 넘치면 오래 안 쓴 키부터 삭제(allkeys-lru), 디스크 저장 끔
          args: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 320Mi
